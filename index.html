<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>چت روم زیبا</title>
  <style>
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl;
    }

    .card {
      background: #fff;
      width: 350px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      width: 95%;
      padding: 12px;
      background: #4e54c8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #3c40a4;
    }

    #chat {
      display: none;
      margin-top: 20px;
    }

    #messages {
      background: #f7f7f7;
      border-radius: 10px;
      height: 250px;
      overflow-y: auto;
      padding: 10px;
      text-align: right;
      border: 1px solid #ddd;
    }

    .msg {
      background: #e8e8ff;
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="card" id="login">
    <h2>ورود به چت روم</h2>
    <input id="name" type="text" placeholder="نام شما">
    <input id="room" type="text" placeholder="نام اتاق">
    <button onclick="joinRoom()">ورود</button>
  </div>

  <div class="card" id="chat">
    <h3 id="roomTitle"></h3>
    <div id="messages"></div>
    <input id="msg" type="text" placeholder="پیام خود را بنویسید">
    <button onclick="sendMessage()">ارسال پیام</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = "";
    let room = "";

    function joinRoom() {
      username = document.getElementById('name').value.trim();
      room = document.getElementById('room').value.trim();

      if (!username || !room) {
        alert('نام و نام اتاق را وارد کنید');
        return;
      }

      document.getElementById('login').style.display = 'none';
      document.getElementById('chat').style.display = 'block';
      document.getElementById('roomTitle').innerText = 'اتاق: ' + room;

      socket.emit('joinRoom', { username, room });
    }

    function sendMessage() {
      const msgInput = document.getElementById('msg');
      const text = msgInput.value.trim();
      if (!text) return;

      socket.emit('chatMessage', { room, username, text });
      msgInput.value = '';
    }

    socket.on('chatMessage', (data) => {
      const div = document.createElement('div');
      div.className = 'msg';
      div.textContent = data.username + ': ' + data.text;
      document.getElementById('messages').appendChild(div);

      const box = document.getElementById('messages');
      box.scrollTop = box.scrollHeight;
    });
  </script>

</body>
</html>
